workflows:
  - name: Weekly Annotation Queues
    steps:
      - id: cron
        type: cron
        enabled: true
        cron_expression: 00 00 * * 01
        openfn:
          uuid: 72930aea-26b2-405b-8500-687e7f6c8a44
        next:
          get-data:
            disabled: false
            condition: always
            openfn:
              uuid: 010ca7af-1a1e-42d8-a3c6-fed361c069ea
      - id: extract-candidates
        name: Extract Candidates
        expression: >
          fn((state) => {
            const byObs = new Map(Object.entries(state.byObs));
            const SCORE_NAME = state.SCORE_NAME;

            const selected = new Map(); // observationId -> reasons[]

            function flag(observationId, reason) {
              if (!observationId) return;
              if (!selected.has(observationId)) selected.set(observationId, []);
              selected.get(observationId).push(reason);
            }

            function pickExtreme(map, sel, direction) {
              const entries = [...map.entries()].filter(([obsId]) => !sel.has(obsId));
              if (entries.length === 0) return null;
              entries.sort((a, b) =>
                direction === "low" ? a[1].value - b[1].value : b[1].value - a[1].value
              );
              return entries[0];
            }

            function shuffle(array) {
              const copy = [...array];
              for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
              }
              return copy;
            }

            for (let i = 0; i < 5; i++) {
              const pick = pickExtreme(byObs, selected, "low");
              if (pick) flag(pick[0], `low ${SCORE_NAME} (${pick[1].value})`);
            }
            for (let i = 0; i < 5; i++) {
              const pick = pickExtreme(byObs, selected, "high");
              if (pick) flag(pick[0], `high ${SCORE_NAME} (${pick[1].value})`);
            }

            const remaining = [...byObs.entries()].filter(([obsId]) => !selected.has(obsId));
            const randomPicks = shuffle(remaining).slice(0, 10);
            for (const [obsId, info] of randomPicks) {
              flag(obsId, `random pick (${SCORE_NAME} ${info.value})`);
            }

            console.log(
              `\nObservations selected: ${selected.size} (target up to 20: 5 low + 5 high + 10 random)`
            );
            for (const [id, reasons] of selected)
              console.log(`  - ${id}: ${reasons.join(", ")}`);


            const selectedArray = [...selected.entries()].map(([observationId, reasons]) => ({
              observationId,
              reasons,
              ...byObs.get(observationId),
            }));

            return { ...state, selected: selectedArray };
          });
        adaptor: '@openfn/language-common@latest'
        openfn:
          uuid: 4186d2ef-50f8-4a90-b0c7-9b6ead91768a
        next:
          post-traces:
            disabled: false
            condition: always
            openfn:
              uuid: dbb96bf2-90f8-475f-b85f-114d3bc42018
      - id: get-data
        name: Get data
        expression: |
          // Get some data from an API...
          get('https://www.example.com');
        adaptor: '@openfn/language-http@latest'
        openfn:
          uuid: df4ec50c-906e-422c-a594-23bdecbdde9c
        next:
          pull-langfuse-traces:
            disabled: false
            condition: always
            openfn:
              uuid: eadd224d-8ef9-4c7f-a08c-20b5c3dc751f
      - id: post-traces
        name: Post Traces
        expression: >
          langfuse(async (state, api) => {
            const { data: configs } = await api.scoreConfigs.get({ limit: 100 });

            return { ...state, configs };
          });


          fn((state) => {
            const { configs, SCORE_CONFIG_NAMES } = state;
            const configByName = new Map(configs.map((c) => [c.name, c]));
            const scoreConfigIds = [];
            for (const name of SCORE_CONFIG_NAMES) {
              const config = configByName.get(name);
              if (!config) throw new Error(`Score config "${name}" not found.`);
              scoreConfigIds.push(config.id);
            }
            console.log(`\nResolved ${scoreConfigIds.length} score configs.`);
            return { ...state, scoreConfigIds };
          });


          langfuse(async (state, api) => {
            const queue = await api.annotationQueues.createQueue({
              name: state.QUEUE_NAME,
              description: `Human review sample from the last 7 days (${state.fromTimestamp} to ${state.toTimestamp}): 5 lowest, 5 highest, and 10 randomly selected observations by "${state.SCORE_NAME}" score.`,
              scoreConfigIds: state.scoreConfigIds,
            });
            console.log(`Created queue: id=${queue.id} name=${queue.name}`);

            return { ...state, queue };
          });


          each(
            $.selected,
            langfuse(async (state, api) => {
              const item = await api.annotationQueues.createQueueItem(state.queue.id, {
                objectId: state.data.observationId,
                objectType: "OBSERVATION",
              });
              console.log(
                `Added ${state.data.observationId} (${state.data.reasons.join(", ")}) -> item ${item.id}`,
              );

              return state;
            }),
          );
        adaptor: '@openfn/language-langfuse@latest'
        openfn:
          uuid: 12ad99f0-68bb-452f-bef7-00d423a8e177
        configuration: jclark@openfn.org|Langfuse for analytics
      - id: pull-langfuse-traces
        name: Pull Langfuse Traces
        expression: >
          const SCORE_CONFIG_NAMES = [
            "Was agent response reasonable",
            "Code quality judge review",
            "Code style judge review",
            "Escalate for deeper review",
            "Comment",
          ];

          const SCORE_NAME = "Code quality judge v5";


          const randomWord = () => Math.random().toString(36).substring(2, 8);


          const now = new Date();

          const oneWeekAgo = new Date(now.getTime() - 7 * 24 * 3600 * 1000);

          const fromTimestamp = oneWeekAgo.toISOString();

          const toTimestamp = now.toISOString();

          const QUEUE_NAME = `Code judge human review queue
          (${fromTimestamp.slice(0, 10)} to ${toTimestamp.slice(0, 10)})
          ${randomWord()}`;


          function toObservationMap(scores) {
            const map = new Map();
            for (const score of scores) {
              if (typeof score.value !== "number") continue;
              if (score.subject?.kind !== "observation") continue;
              const obsId = score.subject.id;
              const existing = map.get(obsId);
              if (!existing || new Date(score.timestamp) > new Date(existing.timestamp)) {
                map.set(obsId, {
                  value: score.value,
                  timestamp: score.timestamp,
                  traceId: score.subject.traceId,
                });
              }
            }
            return map;
          }


          fn((state) => {
            console.log(`Window: ${fromTimestamp} to ${toTimestamp}\n`);
            return state;
          });


          langfuse(async (state, api) => {
            const { data } = await api.scoresV3.getManyV3({
              SCORE_NAME,
              fromTimestamp,
              toTimestamp,
              fields: "subject",
              limit: 100,
            });

            return { ...state, data , SCORE_NAME, fromTimestamp, toTimestamp, QUEUE_NAME, SCORE_CONFIG_NAMES };
          });


          fn((state) => {
            console.log(`Fetched ${state.data.length} "${SCORE_NAME}" scores in window`);
            const byObs = toObservationMap(state.data);
            console.log(
              `Observations with a "${SCORE_NAME}" score in window: ${byObs.size}`,
            );
            return { ...state, byObs: Object.fromEntries(byObs) };
          });
        adaptor: '@openfn/language-langfuse@latest'
        openfn:
          uuid: 15774d7f-55cc-4fea-8d5a-1b6a6c3784b0
        configuration: jclark@openfn.org|Langfuse for analytics
        next:
          extract-candidates:
            disabled: false
            condition: always
            openfn:
              uuid: 71c58712-c954-4d28-8a26-63a9838fecfe
    history:
      - app:5e4a9aba11e9
      - app:19884d4c70b1
      - cli:111ffd09522a
      - app:91c097d1532d
      - cli:7e8f9b63228e
    openfn:
      uuid: 6cbe051d-d88a-4f9e-9c71-47c38df6c8aa
      inserted_at: 2026-07-15T17:25:09Z
      updated_at: 2026-07-28T13:52:00Z
      lock_version: 18
    id: weekly-annotation-queues
    start: cron
  - name: Weekly Summary Email
    steps:
      - id: cron
        type: cron
        enabled: false
        cron_expression: 0 0 * * *
        openfn:
          uuid: 5b9d6353-17f6-4d85-895a-2551342439b1
        next:
          pull-evaluator-scores:
            disabled: false
            condition: always
            openfn:
              uuid: d2522eb3-1a3f-4129-83f9-dd4271ce187d
      - id: pull-evaluator-scores
        name: Pull Evaluator Scores
        expression: >-
          const now = new Date();

          const oneWeekAgo = new Date(now.getTime() - 7 * 24 * 3600 * 1000);

          const fromTimestamp = oneWeekAgo.toISOString();

          const toTimestamp = now.toISOString();


          fn(state =>{
              console.log(`Window: ${fromTimestamp} to ${toTimestamp}\n`);
              return {...state, fromTimestamp, toTimestamp}
          });


          langfuse(async (state, api) => {
            const { fromTimestamp, toTimestamp } = state;

            const allScores = [];
          {
            let cursor;
            while (true) {
              const { data, meta } = await api.scoresV3.getManyV3({
                source: "EVAL",
                fromTimestamp,
                toTimestamp,
                fields: "details",
                limit: 100,
                cursor,
              });
              allScores.push(...data);
              if (!meta.cursor) break;
              cursor = meta.cursor;
            }
          }

          console.log(`Total EVAL-source scores in window:
          ${allScores.length}`);

            return { ...state, allScores };
          });
        adaptor: '@openfn/language-langfuse@1.0.0'
        openfn:
          uuid: f900e894-26bf-4226-8498-74ccc34f018f
        configuration: jclark@openfn.org|Langfuse for analytics
        next:
          summarize-with-claude:
            disabled: false
            condition: on_job_success
            openfn:
              uuid: 1ff80205-e7e7-489f-84e1-e302ddcf747f
      - id: send-email
        name: Send Email
        expression: >
          const RECIPIENTS = [
            'joe@openfn.org',
            'hanna@openfn.org'
          ];


          fn((state) => {
            const { summaryText, dateRangeLabel } = state;
            if (!summaryText) {
              console.log('No summaryText in state — nothing to send.');
              return state;
            }
            return { ...state, RECIPIENTS, emailSubject: `AI Assistant Feedback Summary (${dateRangeLabel})`, emailBody: summaryText };
          });


          each($.RECIPIENTS, (state) => {
            const { emailSubject, emailBody } = state;
            return sendMessage({
              to: state.data,
              subject: emailSubject,
              body: emailBody,
            })(state);
          });
        adaptor: '@openfn/language-gmail@3.0.0'
        openfn:
          uuid: fd8d19f1-3c22-4cb1-848a-52d324d67198
        configuration: jclark@openfn.org|Assistant anyltics gmail joe
      - id: summarize-with-claude
        name: Summarize with Claude
        expression: >
          const systemPrompt =
            "You analyze quality-evaluator feedback comments about an AI assistant that helps build OpenFN workflows and job code. " +
            "You will be given a deduplicated list of comments from non-perfect scores by one evaluator, each with how many times " +
            "an identical comment occurred and the average score attached to it. Cluster them into recurring issue themes, then " +
            "write ONE paragraph (3-5 sentences) summarizing the most recurrent issues, citing rough frequency where useful. " +
            'Respond with ONLY valid JSON, no other text: {"themes": [{"label": string, "count": number, "example": string}], "summary": string}';

          function dedupe(entries) {
            const map = new Map(); // comment -> { count, values }
            for (const { value, comment } of entries) {
              if (!map.has(comment)) map.set(comment, { count: 0, values: [] });
              const e = map.get(comment);
              e.count++;
              e.values.push(value);
            }
            return [...map.entries()].map(([comment, e]) => ({
              comment,
              count: e.count,
              avgValue: e.values.reduce((a, b) => a + b, 0) / e.values.length,
            }));
          }


          fn((state) => {
            const { fromTimestamp, toTimestamp, allScores } = state;
            const dateRangeLabel = `${fromTimestamp.slice(0, 10)} to ${toTimestamp.slice(0, 10)}`;
            const dateRangeSlug = `${fromTimestamp.slice(0, 10)}_to_${toTimestamp.slice(0, 10)}`;

            const byEvaluator = {}; // plain object (not Map) so it survives JSON serialization
            for (const score of allScores) {
              if (score.dataType !== "NUMERIC") continue;
              if (score.value === 1) continue; // perfect score - no signal
              if (!score.comment || !score.comment.trim()) continue;
              if (!byEvaluator[score.name]) byEvaluator[score.name] = [];
              byEvaluator[score.name].push({
                value: score.value,
                comment: score.comment.trim(),
              });
            }

            const evaluatorNames = Object.keys(byEvaluator);
            console.log(
              `\nEvaluators with non-perfect commented scores: ${evaluatorNames.length}`,
            );
            for (const name of evaluatorNames)
              console.log(`  - ${name}: ${byEvaluator[name].length} comments`);
            return {
              ...state,
              byEvaluator: Object.entries(byEvaluator),
              dateRangeLabel,
              dateRangeSlug,
            };
          });


          each($.byEvaluator, async (state) => {
            const { dateRangeLabel, dateRangeSlug } = state;
            const [evaluatorName, entries] = state.data;
            const deduped = dedupe(entries);
            console.log(
              `\n=== ${evaluatorName} (${entries.length} comments, ${deduped.length} distinct) ===`,
            );

            const commentList = deduped
              .sort((a, b) => b.count - a.count)
              .map(
                (d) =>
                  `- "${d.comment}" (occurred ${d.count}x, avg score ${d.avgValue.toFixed(2)})`,
              )
              .join("\n");

            const newState = await prompt(commentList, {
              system: systemPrompt,
              model: "claude-sonnet-5",
              max_tokens: 4096,
            })(state);

            const textBlock = newState.data?.content?.find((b) => b.type === "text");
            const raw = (textBlock?.text ?? "")
              .trim()
              .replace(/^```(?:json)?\n?/, "")
              .replace(/\n?```$/, "");

            let parsed;
            try { parsed = JSON.parse(raw); }
            catch (e) { parsed = { themes: [], summary: raw }; }

            for (const t of parsed.themes ?? [])
              console.log(`  - ${t.label} (x${t.count}): "${t.example}"`);
            console.log(`\nSummary:\n${parsed.summary}`);

            const results = { ...(state.results ?? {}), [evaluatorName]: {
              commentCount: entries.length,
              distinctCommentCount: deduped.length,
              ...parsed,
            }};

            return { ...newState, results };
          });


          fn((state) => {
            const { results, dateRangeLabel, dateRangeSlug } = state;
            const summaryText = Object.entries(results ?? {})
              .map(([name, r]) => `${name}\n${"-".repeat(name.length)}\n\n${r.summary}`)
              .join("\n\n\n");
            console.log(`\nBuilt summaries for ${Object.keys(results ?? {}).length} evaluator(s)`);
            return { ...state, summaryText, dateRangeLabel, dateRangeSlug };
          });
        adaptor: '@openfn/language-claude@1.1.2'
        openfn:
          uuid: 9aaf6201-4652-49e9-890d-da76714a3733
        configuration: jclark@openfn.org|Claude assistant analytics
        next:
          send-email:
            disabled: false
            condition: on_job_success
            openfn:
              uuid: 65ddfdf6-d088-4fb8-89ab-fadfffa63d5e

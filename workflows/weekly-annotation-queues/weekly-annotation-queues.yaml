id: weekly-annotation-queues
name: Weekly Annotation Queues
start: cron
steps:
  - id: cron
    type: cron
    enabled: false
    cron_expression: 0 0 * * *
    next:
      get-data:
        disabled: false
        condition: always
  - id: extract-candidates
    name: Extract Candidates
    adaptor: '@openfn/language-common@latest'
    expression: ./extract-candidates.js
    next:
      post-traces:
        disabled: false
        condition: always
  - id: get-data
    name: Get data
    adaptor: '@openfn/language-http@latest'
    expression: ./get-data.js
    next:
      pull-langfuse-traces:
        disabled: false
        condition: always
  - id: post-traces
    name: Post Traces
    adaptor: '@openfn/language-langfuse@latest'
    expression: ./post-traces.js
  - id: pull-langfuse-traces
    name: Pull Langfuse Traces
    adaptor: '@openfn/language-langfuse@latest'
    expression: ./pull-langfuse-traces.js
    next:
      extract-candidates:
        disabled: false
        condition: always
